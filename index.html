<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 工具导航站</title>
  <meta name="description" content="AI 工具导航站：分类、搜索、收藏与推荐。纯前端单页，可直接部署到 GitHub Pages。" />
  <meta property="og:title" content="AI 工具导航站" />
  <meta property="og:description" content="分类、搜索、收藏与推荐。纯前端单页，可直接部署到 GitHub Pages。" />
  <meta property="og:type" content="website" />
  <style>
    :root{
      --bg:#ffffff;
      --panel:#ffffff;
      --panel2:#f8fafc;
      --text:#0f172a;
      --muted:#64748b;
      --line:rgba(15,23,42,.10);
      --shadow:0 10px 30px rgba(15,23,42,.08);
      --accent:#7C3AED;
      --accent2:#6d28d9;
      --good:#22c55e;
      --warn:#f59e0b;
      --radius:12px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: var(--bg);
      color:var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      line-height:1.5;
    }
    a{color:inherit;text-decoration:none}
    .container{max-width:1180px;margin:0 auto;padding:14px}
    .topbar{
      position:sticky;top:0;z-index:20;
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,.82);
      border-bottom:1px solid var(--line);
    }
    .topbar-inner{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:14px 20px;max-width:1180px;margin:0 auto}
    .brand{display:flex;align-items:center;gap:10px;min-width:240px}
    .logo{
      width:34px;height:34px;border-radius:10px;
      background: radial-gradient(12px 12px at 30% 30%, rgba(255,255,255,.35), transparent 60%),
                  linear-gradient(135deg, rgba(124,58,237,1), rgba(59,130,246,.75));
      box-shadow: 0 10px 20px rgba(124,58,237,.22);
    }
    .brand-title{font-weight:700;letter-spacing:.2px}
    .brand-sub{font-size:12px;color:var(--muted);margin-top:1px}
    .brand-text{display:flex;flex-direction:column;line-height:1.1}
    .actions{display:flex;align-items:center;gap:10px}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      border:1px solid var(--line);
      background: rgba(248,250,252,.9);
      color:var(--text);
      border-radius:999px;
      padding:10px 14px;
      font-size:13px;
      cursor:pointer;
      user-select:none;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .btn:hover{transform: translateY(-1px); border-color: rgba(167,139,250,.35)}
    .btn.primary{background: linear-gradient(135deg, rgba(124,58,237,1), rgba(59,130,246,.95)); border-color: rgba(124,58,237,.35); color:#fff}
    .btn.ghost{background:transparent}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:7px 10px;border-radius:999px;
      background: rgba(248,250,252,.9);
      border:1px solid var(--line);
      font-size:12px;color:rgba(15,23,42,.82);
    }
    .pill b{color:var(--accent2)}
    .layout{display:grid;grid-template-columns: 1fr 320px;gap:18px;margin-top:12px}
    .panel{
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .panel.pad{padding:14px}
    .hero-banner{
      border-radius: 18px;
      border: 1px solid rgba(124,58,237,.10);
      background:
        radial-gradient(900px 320px at 15% 15%, rgba(124,58,237,.20), transparent 55%),
        radial-gradient(900px 320px at 100% 0%, rgba(59,130,246,.16), transparent 55%),
        linear-gradient(135deg, rgba(124,58,237,.15), rgba(59,130,246,.10));
      box-shadow: 0 18px 60px rgba(15,23,42,.12);
      padding: 12px 12px;
    }
    .hero-inner{max-width: 980px; margin: 0 auto; text-align:center}
    .hero-title{font-size:22px; letter-spacing:.2px; margin:0; font-weight:800}
    .hero-search{
      margin: 12px auto 0;
      display:flex;
      align-items:center;
      gap:10px;
      width: min(760px, 100%);
      padding: 12px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(15,23,42,.12);
      box-shadow: 0 16px 40px rgba(15,23,42,.10);
    }
    .hero-search svg{opacity:.70}
    .hero-search input{
      flex:1;
      border:0;
      outline:0;
      background:transparent;
      color: var(--text);
      font-size: 14px;
    }
    .hero-search input::placeholder{color: rgba(100,116,139,.9)}
    .tabs{
      display:flex;
      flex-wrap:nowrap;
      overflow-x:auto;
      -webkit-overflow-scrolling: touch;
      gap:8px;
      padding:10px 12px;
      border-top:1px solid var(--line);
    }
    .tab{
      padding:8px 10px;border-radius:999px;
      border:1px solid var(--line);
      background: rgba(248,250,252,.95);
      color: rgba(15,23,42,.84);
      font-size:12px;
      white-space:nowrap;
      cursor:pointer;
      transition: background .12s ease, border-color .12s ease, transform .12s ease;
    }
    .tab:hover{transform: translateY(-1px); border-color: rgba(167,139,250,.35)}
    .tab.active{
      background: rgba(124,58,237,.10);
      border-color: rgba(124,58,237,.25);
      color: rgba(15,23,42,.92);
    }
    .cat-quick{
      display:flex;
      gap:10px;
      padding: 10px 12px 12px;
      border-top: 1px solid var(--line);
      overflow-x:auto;
      -webkit-overflow-scrolling: touch;
    }
    .cat-btn{
      border: 1px solid rgba(15,23,42,.10);
      background: rgba(255,255,255,.92);
      border-radius: 14px;
      padding: 9px 10px 10px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      cursor:pointer;
      user-select:none;
      min-width: 92px;
      transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    }
    .cat-btn:hover{transform: translateY(-2px); border-color: rgba(124,58,237,.22); box-shadow: 0 14px 30px rgba(15,23,42,.08)}
    .cat-btn.active{border-color: rgba(124,58,237,.28); box-shadow: 0 14px 30px rgba(124,58,237,.10)}
    .cat-ico{
      width: 34px; height: 34px;
      border-radius: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(135deg, rgba(124,58,237,.16), rgba(59,130,246,.12));
      color: rgba(124,58,237,.95);
    }
    .cat-name{font-size:12px; color: rgba(15,23,42,.80); text-align:center; line-height:1.2}
    .grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:12px;
      padding:14px 16px 16px;
      border-top:1px solid var(--line);
    }
    .card{
      border:1px solid var(--line);
      background: rgba(255,255,255,.96);
      border-radius: var(--radius);
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height: 150px;
      transition: transform .12s ease, border-color .12s ease;
    }
    .card:hover{transform: translateY(-2px); border-color: rgba(167,139,250,.35)}
    .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .card-title{font-weight:700;font-size:13.5px;margin:0}
    .card-desc{margin:0;color:var(--muted);font-size:12.5px}
    .tags{display:flex;flex-wrap:wrap;gap:6px}
    .tag{
      font-size:11px;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid var(--line);
      background: rgba(248,250,252,.95);
      color: rgba(15,23,42,.72);
    }
    .card-actions{display:flex;align-items:center;gap:8px;margin-top:auto}
    .mini{
      padding:8px 10px;border-radius:999px;
      border:1px solid var(--line);
      background: rgba(248,250,252,.95);
      color: rgba(15,23,42,.86);
      font-size:12px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:7px;
    }
    .mini.primary{
      background: rgba(124,58,237,.10);
      border-color: rgba(124,58,237,.22);
    }
    .mini:hover{border-color: rgba(167,139,250,.35)}
    .star{
      width:34px;height:34px;border-radius:999px;
      border:1px solid var(--line);
      background: rgba(248,250,252,.95);
      cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;
    }
    .star[aria-pressed="true"]{border-color: rgba(124,58,237,.32); background: rgba(124,58,237,.10)}
    .muted{color:var(--muted)}
    .rightcol{display:flex;flex-direction:column;gap:12px}
    .ad{
      border: 1px solid rgba(15,23,42,.10);
      border-radius: var(--radius);
      background: rgba(255,255,255,.96);
      padding:12px;
    }
    .ad-top{margin:16px 0 0}
    .ad-label{
      display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px
    }
    .ad-label span{font-size:12px;color:rgba(15,23,42,.72)}
    .badge{
      font-size:11px;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid rgba(124,58,237,.22);
      background: rgba(124,58,237,.10);
      color: rgba(124,58,237,.95);
    }
    .ad-slot{
      border-radius: 10px;
      background: rgba(248,250,252,.9);
      border:1px solid rgba(15,23,42,.08);
      padding:12px;
      color: rgba(15,23,42,.84);
      font-size:12.5px;
      line-height:1.55;
    }
    .ad-slot b{color:rgba(15,23,42,.92)}
    .stat{
      display:flex;gap:10px;flex-wrap:wrap
    }
    .stat .pill{background: rgba(255,255,255,.85)}
    .foot{
      margin:18px 0 30px;
      padding:14px 16px;
      border-top:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    }
    .foot a{color:rgba(15,23,42,.78)}
    .foot a:hover{color:rgba(15,23,42,.92)}
    .divider{width:1px;height:12px;background: var(--line)}
    .toast{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 18px;
      background: rgba(15,23,42,.92);
      border: 1px solid rgba(15,23,42,.18);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 12.5px;
      color: rgba(255,255,255,.96);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      z-index: 60;
      max-width: calc(100vw - 24px);
      text-align:center;
    }
    .toast.show{opacity:1; transform: translateX(-50%) translateY(-6px)}
    .float-cta{
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 55;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-end;
    }
    .fab{
      border-radius: 999px;
      padding: 12px 14px;
      background: linear-gradient(135deg, rgba(124,58,237,1), rgba(99,102,241,.95));
      color: white;
      border: 1px solid rgba(124,58,237,.55);
      box-shadow: 0 18px 40px rgba(124,58,237,.22);
      cursor:pointer;
      font-size: 13px;
      display:inline-flex;align-items:center;gap:8px;
      user-select:none;
    }
    .fab.secondary{
      background: rgba(255,255,255,.92);
      color: rgba(15,23,42,.86);
      border-color: rgba(15,23,42,.12);
      box-shadow: var(--shadow);
    }
    .inline-ad{
      grid-column: 1 / -1;
      border-radius: var(--radius);
      overflow:hidden;
    }
    @media (max-width: 980px){
      .layout{grid-template-columns: 1fr}
      .rightcol{order:-1}
      .brand{min-width:0}
    }
    @media (max-width: 860px){
      .grid{grid-template-columns: repeat(2, minmax(0, 1fr))}
    }
    @media (max-width: 520px){
      .topbar-inner{flex-wrap:wrap}
      .brand{width:100%}
      .actions{width:100%;justify-content:flex-end}
      .grid{grid-template-columns: 1fr}
      .float-cta{right: 12px; bottom: 12px}
      .hero-title{font-size:22px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div class="brand-text">
          <div class="brand-title">AI 工具导航站</div>
          <div class="brand-sub">分类 · 搜索 · 收藏</div>
        </div>
      </div>

      <div class="actions">
        <button class="btn ghost" id="showFavs" data-event="nav_show_favs" type="button">只看收藏</button>
        <button class="btn primary" id="submitTool" data-event="nav_submit_tool" type="button">服务器选型</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero-banner" aria-label="搜索区域">
      <div class="hero-inner">
        <h1 class="hero-title">发现好用的 AI 工具</h1>

        <div class="hero-search" role="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="2" opacity=".95"/>
            <path d="M16.2 16.2 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".95"/>
          </svg>
          <input id="q" type="text" autocomplete="off" placeholder="你想找什么？例如：PPT、绘画、剪辑、写作、API…" />
          <span class="pill" title="当前筛选"><b id="activeCat">全部</b><span id="count">0</span></span>
        </div>
      </div>
    </section>

    <section class="layout">
      <section class="panel" aria-label="工具列表">
        <div class="tabs" id="tabs" role="tablist" aria-label="分类筛选"></div>
        <div class="cat-quick" id="catQuick" aria-label="分类图标"></div>
        <div class="grid" id="grid" aria-live="polite"></div>

        <div class="foot">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <span class="muted">© <span id="year"></span> AI 工具导航站</span>
            <span class="divider" aria-hidden="true"></span>
            <a href="#" id="openDisclaimer" data-event="open_disclaimer">免责声明</a>
            <span class="divider" aria-hidden="true"></span>
            <a href="#" id="openPrivacy" data-event="open_privacy">隐私政策</a>
          </div>
          <div class="muted">外链仅供参考，请自行甄别风险。</div>
        </div>
      </section>

      <aside class="rightcol" aria-label="侧栏">
        <section class="panel pad">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
            <div>
              <div style="font-weight:700">1bgp.com 服务器推荐</div>
              <div class="muted" style="font-size:12px;margin-top:4px">云服务器 · 物理服务器 · OpenClaw/算力部署</div>
            </div>
            <span class="badge">推荐</span>
          </div>
          <div class="muted" style="font-size:12.5px;margin-top:10px;line-height:1.7">
            适合：AI Agent 部署、推理接口、算力服务器、长期任务与业务上线。
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
            <a class="mini primary" href="https://www.1bgp.com/" target="_blank" rel="noopener noreferrer" data-event="cta_1bgp_primary">去官网选型</a>
            <a class="mini" href="https://www.1bgp.com/" target="_blank" rel="noopener noreferrer" data-event="cta_1bgp_secondary">查看报价</a>
          </div>
        </section>
      </aside>
    </section>
  </main>

  <div class="float-cta">
    <a class="fab" id="fabMain" href="https://www.1bgp.com/" target="_blank" rel="noopener noreferrer" data-event="fab_1bgp">查看 1bgp 服务器</a>
    <button class="fab secondary" id="fabTop" data-event="fab_back_top" type="button">回到顶部</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const tools = [
      { name: "ChatGPT", desc: "通用对话与写作助手，适合内容生成与问题解答。", url: "https://chat.openai.com", cat: "对话/助手", tags: ["写作","问答","通用"] },
      { name: "Kimi", desc: "长文阅读与写作助手，适合总结资料、写方案与对话。", url: "https://kimi.moonshot.cn", cat: "对话/助手", tags: ["长文","总结","中文"] },
      { name: "豆包", desc: "面向日常办公与内容生成的对话助手。", url: "https://www.doubao.com", cat: "对话/助手", tags: ["中文","办公","写作"] },
      { name: "通义千问", desc: "通用对话与创作助手，覆盖写作、问答与办公。", url: "https://tongyi.aliyun.com", cat: "对话/助手", tags: ["中文","通用","办公"] },
      { name: "Claude", desc: "长文本理解与总结表现突出，适合报告与资料整理。", url: "https://claude.ai", cat: "对话/助手", tags: ["总结","长文","分析"] },
      { name: "Gemini", desc: "多模态能力强，适合搜索式问答与内容辅助。", url: "https://gemini.google.com", cat: "对话/助手", tags: ["多模态","问答","办公"] },
      { name: "Perplexity", desc: "检索增强问答，适合快速查资料与引用。", url: "https://www.perplexity.ai", cat: "对话/助手", tags: ["检索","引用","快速"] },
      { name: "Notion AI", desc: "知识库与写作结合，适合团队文档与 SOP。", url: "https://www.notion.so/product/ai", cat: "办公/知识库", tags: ["文档","SOP","协作"] },
      { name: "飞书智能助手", desc: "协作办公场景更顺手，适合企业内部流程。", url: "https://www.feishu.cn", cat: "办公/知识库", tags: ["协作","会议","企业"] },
      { name: "Gamma", desc: "一键生成演示文稿，适合汇报与路演。", url: "https://gamma.app", cat: "办公/知识库", tags: ["PPT","汇报","排版"] },
      { name: "Tome", desc: "故事化演示与页面生成，适合营销与提案。", url: "https://tome.app", cat: "办公/知识库", tags: ["提案","演示","营销"] },

      { name: "Midjourney", desc: "高质量图像生成，适合视觉风格探索。", url: "https://www.midjourney.com", cat: "图片生成", tags: ["图像","风格","创作"] },
      { name: "Stable Diffusion", desc: "开源图像生成生态丰富，适合可控创作。", url: "https://stability.ai", cat: "图片生成", tags: ["开源","可控","模型"] },
      { name: "Leonardo", desc: "面向素材与游戏美术的图像生成平台。", url: "https://leonardo.ai", cat: "图片生成", tags: ["素材","游戏","美术"] },
      { name: "Canva", desc: "设计模板丰富，结合 AI 快速产出海报。", url: "https://www.canva.com", cat: "图片生成", tags: ["海报","模板","设计"] },
      { name: "Remove.bg", desc: "一键抠图去背景，适合电商与素材制作。", url: "https://www.remove.bg", cat: "图片生成", tags: ["抠图","电商","素材"] },
      { name: "Figma", desc: "协作设计工具，适合原型与 UI 产出。", url: "https://www.figma.com", cat: "设计/产品", tags: ["UI","原型","协作"] },

      { name: "CapCut", desc: "短视频剪辑与模板，适合快速出片。", url: "https://www.capcut.com", cat: "视频/音频", tags: ["剪辑","模板","短视频"] },
      { name: "Runway", desc: "视频生成与编辑，适合创意视频与特效。", url: "https://runwayml.com", cat: "视频/音频", tags: ["视频生成","特效","创意"] },
      { name: "Descript", desc: "音视频文本化编辑，适合播客与口播。", url: "https://www.descript.com", cat: "视频/音频", tags: ["字幕","播客","口播"] },
      { name: "ElevenLabs", desc: "高拟真配音与 TTS，适合配音与旁白。", url: "https://elevenlabs.io", cat: "视频/音频", tags: ["配音","TTS","旁白"] },
      { name: "Adobe Podcast", desc: "语音增强与降噪，提升录音质量。", url: "https://podcast.adobe.com", cat: "视频/音频", tags: ["降噪","增强","录音"] },
      { name: "AIVA", desc: "AI 作曲与配乐生成，适合短视频配乐。", url: "https://www.aiva.ai", cat: "视频/音频", tags: ["配乐","作曲","生成"] },

      { name: "Jasper", desc: "营销文案写作，适合广告与落地页。", url: "https://www.jasper.ai", cat: "营销/文案", tags: ["文案","营销","广告"] },
      { name: "Copy.ai", desc: "多场景文案模板，适合社媒与投放。", url: "https://www.copy.ai", cat: "营销/文案", tags: ["社媒","投放","模板"] },
      { name: "Grammarly", desc: "英文润色与纠错，适合国际化内容。", url: "https://www.grammarly.com", cat: "营销/文案", tags: ["润色","英文","纠错"] },
      { name: "QuillBot", desc: "改写与降重，适合多版本内容输出。", url: "https://quillbot.com", cat: "营销/文案", tags: ["改写","降重","写作"] },
      { name: "Hemingway", desc: "可读性优化，适合提升内容清晰度。", url: "https://hemingwayapp.com", cat: "营销/文案", tags: ["可读性","简化","写作"] },
      { name: "Ahrefs", desc: "SEO 分析与关键词研究，适合站点增长。", url: "https://ahrefs.com", cat: "营销/文案", tags: ["SEO","关键词","分析"] },

      { name: "GitHub Copilot", desc: "代码补全与建议，提升开发效率。", url: "https://github.com/features/copilot", cat: "开发/效率", tags: ["代码","补全","IDE"] },
      { name: "Cursor", desc: "AI 编程编辑器，适合代码改写与理解。", url: "https://www.cursor.com", cat: "开发/效率", tags: ["编辑器","改写","理解"] },
      { name: "Postman", desc: "API 调试与协作，适合接口开发与测试。", url: "https://www.postman.com", cat: "开发/效率", tags: ["API","测试","协作"] },
      { name: "Dify", desc: "应用编排与工作流，适合搭建 AI 应用。", url: "https://dify.ai", cat: "开发/效率", tags: ["工作流","应用","编排"] },
      { name: "Zapier", desc: "自动化连接工具，适合无代码流程集成。", url: "https://zapier.com", cat: "开发/效率", tags: ["自动化","集成","无代码"] },
      { name: "n8n", desc: "开源自动化工作流，适合自部署与扩展。", url: "https://n8n.io", cat: "开发/效率", tags: ["开源","自动化","自部署"] },

      { name: "Whimsical", desc: "流程图与线框图，适合产品梳理。", url: "https://whimsical.com", cat: "设计/产品", tags: ["流程图","线框","协作"] },
      { name: "Miro", desc: "在线白板协作，适合头脑风暴与培训。", url: "https://miro.com", cat: "设计/产品", tags: ["白板","协作","共创"] },
      { name: "Excalidraw", desc: "手绘风图表，适合快速表达与分享。", url: "https://excalidraw.com", cat: "设计/产品", tags: ["图表","手绘","快速"] },
      { name: "Framer", desc: "高质量落地页与交互，适合营销页面。", url: "https://www.framer.com", cat: "设计/产品", tags: ["落地页","交互","发布"] },
      { name: "Webflow", desc: "可视化建站，适合无代码搭建页面。", url: "https://webflow.com", cat: "设计/产品", tags: ["建站","无代码","发布"] },
      { name: "Tally", desc: "轻量表单，适合收集线索与报名。", url: "https://tally.so", cat: "设计/产品", tags: ["表单","线索","报名"] },

      { name: "Google Sheets", desc: "表格与数据整理，适合轻量数据运营。", url: "https://docs.google.com/spreadsheets", cat: "数据/分析", tags: ["表格","整理","运营"] },
      { name: "Airtable", desc: "表格数据库，适合内容库与轻应用。", url: "https://airtable.com", cat: "数据/分析", tags: ["数据库","内容库","协作"] },
      { name: "Metabase", desc: "BI 看板与查询，适合数据可视化。", url: "https://www.metabase.com", cat: "数据/分析", tags: ["BI","看板","查询"] },
      { name: "Looker Studio", desc: "数据报表与可视化，适合投放复盘。", url: "https://lookerstudio.google.com", cat: "数据/分析", tags: ["报表","可视化","复盘"] },
      { name: "Hotjar", desc: "用户行为洞察，适合落地页优化。", url: "https://www.hotjar.com", cat: "数据/分析", tags: ["热力图","行为","优化"] },
      { name: "GA4", desc: "站点统计分析，适合基础数据监测。", url: "https://analytics.google.com", cat: "数据/分析", tags: ["统计","转化","监测"] }
    ];

    const state = {
      activeCat: "全部",
      q: "",
      favOnly: false,
      favs: new Set()
    };

    const els = {
      q: document.getElementById("q"),
      tabs: document.getElementById("tabs"),
      catQuick: document.getElementById("catQuick"),
      grid: document.getElementById("grid"),
      activeCat: document.getElementById("activeCat"),
      count: document.getElementById("count"),
      catCount: document.getElementById("catCount"),
      toolCount: document.getElementById("toolCount"),
      favCount: document.getElementById("favCount"),
      showFavs: document.getElementById("showFavs"),
      year: document.getElementById("year"),
      toast: document.getElementById("toast"),
      fabMain: document.getElementById("fabMain"),
      fabTop: document.getElementById("fabTop"),
      submitTool: document.getElementById("submitTool"),
      openDisclaimer: document.getElementById("openDisclaimer"),
      openPrivacy: document.getElementById("openPrivacy")
    };

    const LS_KEY = "aiNav:favs";

    function getCategories(items){
      const set = new Set(items.map(x => x.cat));
      return ["全部", ...Array.from(set).sort((a,b) => a.localeCompare(b, "zh-Hans-CN"))];
    }

    function normalize(s){return (s || "").toLowerCase().trim();}

    function matchesQuery(item, q){
      if(!q) return true;
      const hay = [
        item.name,
        item.desc,
        item.cat,
        ...(item.tags || [])
      ].join(" ").toLowerCase();
      return hay.includes(q);
    }

    function shouldShow(item){
      if(state.activeCat !== "全部" && item.cat !== state.activeCat) return false;
      if(state.favOnly && !state.favs.has(item.name)) return false;
      if(!matchesQuery(item, state.q)) return false;
      return true;
    }

    function escapeHtml(s){
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function toast(msg){
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => els.toast.classList.remove("show"), 1600);
    }

    function track(el){
      const ev = el?.dataset?.event;
      if(!ev) return;
      window.__events = window.__events || [];
      window.__events.push({ event: ev, ts: Date.now() });
    }

    function saveFavs(){
      localStorage.setItem(LS_KEY, JSON.stringify(Array.from(state.favs)));
      updateCounts();
    }

    function loadFavs(){
      try{
        const raw = localStorage.getItem(LS_KEY);
        if(!raw) return;
        const arr = JSON.parse(raw);
        if(Array.isArray(arr)) state.favs = new Set(arr);
      }catch(_){}
    }

    function updateCounts(filteredCount){
      const categories = getCategories(tools);
      els.catCount.textContent = String(categories.length - 1);
      els.toolCount.textContent = String(tools.length);
      els.favCount.textContent = String(state.favs.size);
      if(typeof filteredCount === "number") els.count.textContent = String(filteredCount);
    }

    function renderTabs(){
      const categories = getCategories(tools);
      els.tabs.innerHTML = categories.map(cat => {
        const active = cat === state.activeCat ? "active" : "";
        return `<button class="tab ${active}" type="button" role="tab" aria-selected="${active ? "true" : "false"}" data-cat="${escapeHtml(cat)}" data-event="tab_${escapeHtml(cat)}">${escapeHtml(cat)}</button>`;
      }).join("");
    }

    function iconSvg(cat){
      const common = {
        "对话/助手": `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 18a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4H11l-4 3v-3H7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`,
        "办公/知识库": `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 4h10a2 2 0 0 1 2 2v14H7a2 2 0 0 0-2 2V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="2"/><path d="M7 20h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
        "图片生成": `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6Z" stroke="currentColor" stroke-width="2"/><path d="M8.5 10.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z" fill="currentColor" opacity=".9"/><path d="M4 16l4-4 4 4 3-3 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
        "视频/音频": `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Z" stroke="currentColor" stroke-width="2"/><path d="M17 10.5 21 8v8l-4-2.5v-3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`,
        "营销/文案": `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 11h4l10-6v14l-10-6H4v-2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6 13v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
        "开发/效率": `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16 18 22 12 16 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 6 2 12l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
        "设计/产品": `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 3 8v8l9 5 9-5V8l-9-5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 12 3 8m9 4 9-4" stroke="currentColor" stroke-width="2" opacity=".85"/></svg>`,
        "数据/分析": `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 19V5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 19h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8 16v-5m4 5V7m4 9v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`
      };
      return common[cat] || `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z" stroke="currentColor" stroke-width="2"/><path d="M12 7v6l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
    }

    function renderCatQuick(){
      if(!els.catQuick) return;
      const categories = getCategories(tools).filter(x => x !== "全部");
      const list = categories.slice(0, 16);
      els.catQuick.innerHTML = list.map(cat => {
        const active = cat === state.activeCat ? "active" : "";
        return `
          <button class="cat-btn ${active}" type="button" data-cat="${escapeHtml(cat)}" data-event="cat_${escapeHtml(cat)}" aria-label="${escapeHtml(cat)}">
            <span class="cat-ico">${iconSvg(cat)}</span>
            <span class="cat-name">${escapeHtml(cat)}</span>
          </button>
        `;
      }).join("");
    }

    function renderInlineAd(){
      return `
        <div class="ad inline-ad panel" role="region" aria-label="信息流广告">
          <div class="ad-label" style="padding:12px 12px 0">
            <span>信息流广告</span>
            <span class="badge">赞助</span>
          </div>
          <div class="ad-slot" style="margin:12px">
            <div><b>1bgp.com 云服务器 / 物理服务器</b></div>
            <div class="muted">支持部署 OpenClaw / AI Agent、推理接口与算力服务；按需扩容，快速上线。</div>
            <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap">
              <a class="mini primary" href="https://www.1bgp.com/" target="_blank" rel="noopener noreferrer" data-event="ad_feed_click">查看配置</a>
              <a class="mini" href="https://www.1bgp.com/" target="_blank" rel="noopener noreferrer" data-event="ad_feed_contact">进入官网</a>
            </div>
          </div>
        </div>
      `;
    }

    function renderGrid(){
      const list = tools.filter(shouldShow);
      els.activeCat.textContent = state.activeCat;
      updateCounts(list.length);

      if(list.length === 0){
        els.grid.innerHTML = `
          <div class="card" style="grid-column:1 / -1">
            <div class="card-title">没有匹配结果</div>
            <p class="card-desc">尝试更换分类或减少关键词，或取消“只看收藏”。</p>
            <div class="card-actions">
              <button class="mini primary" type="button" id="resetFilters" data-event="reset_filters">重置筛选</button>
              <button class="mini" type="button" id="openCtaEmpty" data-event="cta_from_empty">加入社群/领资料</button>
            </div>
          </div>
        `;
        document.getElementById("resetFilters").addEventListener("click", (e) => {
          track(e.currentTarget);
          state.activeCat = "全部";
          state.q = "";
          state.favOnly = false;
          els.q.value = "";
          els.showFavs.textContent = "只看收藏";
          renderTabs();
          renderGrid();
          toast("已重置筛选");
        });
        document.getElementById("openCtaEmpty").addEventListener("click", (e) => {
          track(e.currentTarget);
          openModal("加入社群 / 领取资料");
        });
        return;
      }

      const nodes = [];
      const insertAt = Math.min(6, list.length);
      list.forEach((item, idx) => {
        if(idx === insertAt) nodes.push(renderInlineAd());
        const fav = state.favs.has(item.name);
        nodes.push(`
          <article class="card" data-name="${escapeHtml(item.name)}" data-cat="${escapeHtml(item.cat)}">
            <div class="card-head">
              <div>
                <h3 class="card-title">${escapeHtml(item.name)}</h3>
                <p class="card-desc">${escapeHtml(item.desc)}</p>
              </div>
              <button class="star" type="button" aria-label="收藏" aria-pressed="${fav ? "true" : "false"}" data-fav="${escapeHtml(item.name)}" data-event="fav_toggle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 17.3 6.2 20.6l1.1-6.6L2.6 9.7l6.6-1 2.8-6 2.8 6 6.6 1-4.7 4.3 1.1 6.6L12 17.3Z" stroke="currentColor" stroke-width="2" opacity="${fav ? "1" : ".7"}" fill="${fav ? "rgba(124,58,237,.35)" : "transparent"}"/>
                </svg>
              </button>
            </div>
            <div class="tags">
              <span class="tag">${escapeHtml(item.cat)}</span>
              ${(item.tags || []).slice(0,3).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("")}
            </div>
            <div class="card-actions">
              <a class="mini primary" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" data-event="tool_open">访问</a>
              <button class="mini" type="button" data-event="tool_copy" data-copy="${escapeHtml(item.name)}｜${escapeHtml(item.url)}">复制链接</button>
            </div>
          </article>
        `);
      });
      els.grid.innerHTML = nodes.join("");

      els.grid.querySelectorAll("[data-fav]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          track(e.currentTarget);
          const name = e.currentTarget.getAttribute("data-fav");
          if(!name) return;
          if(state.favs.has(name)) state.favs.delete(name);
          else state.favs.add(name);
          saveFavs();
          renderGrid();
          toast(state.favs.has(name) ? "已收藏" : "已取消收藏");
        });
      });

      els.grid.querySelectorAll("[data-copy]").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          track(e.currentTarget);
          const text = e.currentTarget.getAttribute("data-copy") || "";
          try{
            await navigator.clipboard.writeText(text);
            toast("已复制到剪贴板");
          }catch(_){
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            ta.remove();
            toast("已复制到剪贴板");
          }
        });
      });

      els.grid.querySelectorAll('a[data-event="tool_open"]').forEach(a => {
        a.addEventListener("click", (e) => track(e.currentTarget));
      });

      els.grid.querySelectorAll('[data-event^="ad_"]').forEach(a => {
        a.addEventListener("click", (e) => track(e.currentTarget));
      });
    }

    function setActiveCat(cat){
      state.activeCat = cat;
      renderTabs();
      renderCatQuick();
      renderGrid();
    }

    function init(){
      loadFavs();
      els.year.textContent = String(new Date().getFullYear());
      renderTabs();
      renderCatQuick();
      renderGrid();
      updateCounts(tools.length);

      els.q.addEventListener("input", () => {
        state.q = normalize(els.q.value);
        renderGrid();
      });

      els.tabs.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-cat]");
        if(!btn) return;
        track(btn);
        const cat = btn.getAttribute("data-cat");
        if(!cat) return;
        setActiveCat(cat);
      });

      if(els.catQuick){
        els.catQuick.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-cat]");
          if(!btn) return;
          track(btn);
          const cat = btn.getAttribute("data-cat");
          if(!cat) return;
          setActiveCat(cat);
        });
      }

      els.showFavs.addEventListener("click", (e) => {
        track(e.currentTarget);
        state.favOnly = !state.favOnly;
        els.showFavs.textContent = state.favOnly ? "显示全部" : "只看收藏";
        renderGrid();
        toast(state.favOnly ? "仅显示收藏" : "显示全部");
      });

      els.fabTop.addEventListener("click", (e) => {
        track(e.currentTarget);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      els.submitTool.addEventListener("click", (e) => {
        track(e.currentTarget);
        window.open("https://www.1bgp.com/", "_blank", "noopener,noreferrer");
      });

      els.openDisclaimer.addEventListener("click", (e) => {
        e.preventDefault();
        track(e.currentTarget);
        toast("免责声明：本站内容仅供参考，外链服务与风险由第三方承担。");
      });

      els.openPrivacy.addEventListener("click", (e) => {
        e.preventDefault();
        track(e.currentTarget);
        toast("隐私政策：收藏数据仅保存在你的浏览器本地，不会上传。");
      });

      document.querySelectorAll('[data-event^="ad_"]').forEach(a => {
        a.addEventListener("click", (e) => {
          track(e.currentTarget);
          const href = e.currentTarget.getAttribute("href");
          if(!href || href === "#"){
            e.preventDefault();
            toast("请替换广告链接");
          }
        });
      });
    }

    init();
  </script>
</body>
</html>
